<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017"><meta name="color-scheme" content="dark">
<title>BCR – Gợi ý</title>
<style>
:root{--bg:#0d1017;--card:#171c27;--bd:#262d3b;--tx:#eef1f6;--mu:#8b95a7;--B:#e53935;--P:#1e88e5;--T:#7cb342;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom));max-width:520px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cnt{color:var(--mu);font-size:15px}
button{font-family:inherit;cursor:pointer}
.rs{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center}
.lb{color:var(--mu);font-size:14px;letter-spacing:.5px}
.big{font-size:60px;font-weight:800;line-height:1.05;margin:2px 0}
.pc{font-size:28px;font-weight:700}
.badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:#262d3b;font-size:14px;font-weight:600}
.why{margin-top:10px;font-size:15px;color:#c9d0dc;text-align:left}
.tie{color:var(--mu);font-size:14px;margin-top:6px}
.beads{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0;min-height:28px}
.d{width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.d.B{background:var(--B)}.d.P{background:var(--P)}.d.T{background:var(--T)}
.row{display:flex;gap:8px}
.k{flex:1;border:0;border-radius:16px;color:#fff;font-size:26px;font-weight:800;padding:22px 0}
.kB{background:var(--B)}.kP{background:var(--P)}.kT{background:var(--T)}
.up{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;width:100%;padding:18px;border:0;border-radius:16px;background:#ffb300;color:#1a1300;font-size:19px;font-weight:800}
.sec{display:flex;gap:8px;margin-top:8px}
.sec button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:14px 4px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:0 4px 16px #0008;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.pr{display:flex;gap:8px;margin-top:12px}.pr div{flex:1;background:#0d1017;border:1px solid var(--bd);border-radius:12px;padding:8px 2px}
.pr small{display:block;color:var(--mu);font-size:12px}.pr b{font-size:21px}
.tag{font-size:13px;color:var(--mu);margin-top:8px}
#stat{font-size:14px;color:#c9d0dc;line-height:1.55}#stat .rw{border-bottom:1px solid var(--bd);padding:6px 0}#stat .rw b{color:var(--tx)}
.foot{color:var(--mu);font-size:13px;text-align:center;margin-top:12px}
details{margin-top:8px;color:var(--mu);font-size:14px}summary{padding:6px 0}
details button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 4px 0 0}
</style></head><body>

<div class="top"><div class="cnt" id="cnt"></div><button class="rs" id="rs">Xáo bài mới</button></div>

<div class="card">
 <div class="lb">NÊN ĐÁNH</div>
 <div class="big" id="door">–</div>
 <div class="pc" id="pct"></div>
 <div class="tie" id="tie"></div>
 <div class="badge" id="badge" style="display:none"></div>
 <div class="pr" id="pr" style="display:none"></div><div class="tag" id="tag"></div>
 <div class="why" id="why"></div>
</div>

<div class="beads" id="beads"></div>

<div class="row"><button class="k kP" data-r="P">CON</button><button class="k kT" data-r="T">HÒA</button><button class="k kB" data-r="B">CÁI</button></div>
<button class="up" id="up">📷 Tải ảnh chụp bảng cầu</button>
<input id="file" type="file" accept="image/*" hidden>
<div class="sec"><button id="undo">↶ Hoàn tác</button></div>
<div class="foot" id="foot"></div>

<details><summary>Thống kê cầu đã học</summary><div id="stat"></div></details>
<details><summary>Dữ liệu học</summary>
 <button id="dl">⬇ Tải file sao lưu</button><button id="ld">⬆ Nạp từ file</button><input id="bf" type="file" accept=".json,application/json" hidden>
 <button id="exp">Sao lưu (chép)</button><button id="imp">Khôi phục</button><button id="wipe">Xóa dữ liệu học</button>
</details>
<div id="toast"></div>

<script>
const NAME={B:'Cái',P:'Con',T:'Hòa'},BASE={B:.4586,P:.4462,T:.0952},M=120,CAP=60,KEY='bcr3';
const $=id=>document.getElementById(id),opp=x=>x==='B'?'P':'B',pc=v=>(100*v).toFixed(1)+'%';

// ===== trạng thái =====
let S={E:[],brain:{m:{},p:{},tot:0},acc:{h:0,n:0}};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.E&&x.brain)S=x}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
function inc(b,k,o,dv){const t=S.brain[b]||(S.brain[b]={});t[k]=t[k]||{};t[k][o]=Math.max(0,(t[k][o]||0)+dv)}
const seqF=()=>S.E.map(e=>e.r).filter(r=>r!=='T');

// ===== nhận diện cầu =====
function runsOf(f){const R=[];for(const x of f){if(R.length&&R[R.length-1].c===x)R[R.length-1].n++;else R.push({c:x,n:1})}return R}
function detect(f){
 const R=runsOf(f);if(!R.length)return null;const L=R[R.length-1],o=opp(L.c);
 if(L.n>=4)return{key:'bet'+Math.min(L.n,7),name:`Cầu bệt ${L.n} ${NAME[L.c]}`,cont:L.c,brk:o,warn:true};
 let k=0;for(let i=R.length-1;i>=0&&R[i].n===1;i--)k++;
 if(k>=4)return{key:'pp'+Math.min(k,6),name:`Cầu 1-1 (${k} tay)`,cont:o,brk:L.c};
 const C=R.slice(0,-1);
 if(C.length>=4){const[a,b,c,d]=C.slice(-4).map(x=>x.n);
  if(a===c&&b===d&&a+b===3){
   if(L.n<a)return{key:'p12',name:`Cầu ${a}-${b}`,cont:L.c,brk:o};
   if(L.n===a)return{key:'p12',name:`Cầu ${a}-${b}`,cont:o,brk:L.c}}}
 return null}

// ===== dự đoán =====
function predict(f){
 const det=detect(f),est={...BASE};let reason='',badge=det?det.name:'',door,info=null;
 if(det){
  const c=S.brain.p[det.key]||{},C=c.C||0,X=c.X||0,T=c.T||0,n=C+X+T;
  est[det.cont]=(C+M*BASE[det.cont])/(n+M);est[det.brk]=(X+M*BASE[det.brk])/(n+M);est.T=(T+M*BASE.T)/(n+M);
  info={n,eC:est[det.cont],eX:est[det.brk],eT:est.T,z:n?(C-n*BASE[det.cont])/Math.sqrt(n*BASE[det.cont]*(1-BASE[det.cont])):0};
  door=est.B>=est.P?'B':'P';
  reason=(door===det.cont?'Theo cầu ':'Bẻ cầu ')+NAME[door]+'. ';
  reason+=n>=25?`Đã học ${n} lần cầu này: tiếp tục ${C}, bẻ ${X}, hòa ${T}.`:n?`Mới học ${n} lần, xác suất còn gần mức gốc.`:'Chưa có dữ liệu học cho cầu này, dùng xác suất gốc.';
  if(det.warn)reason+=' ⚠ Bệt dài, cân nhắc bẻ cầu.';
 }else if(f.length){
  let k=Math.min(3,f.length),use=null;
  for(;k>=1;k--){const key='m'+k+':'+f.slice(-k).join(''),c=S.brain.m[key]||{},n=(c.B||0)+(c.P||0)+(c.T||0);if(n>=25||k===1){use={k,key,c,n};break}}
  const c=use.c,n=use.n;
  for(const o of'BPT')est[o]=((c[o]||0)+M*BASE[o])/(n+M);
  door=est.B>=est.P?'B':'P';badge='Markov bậc '+use.k;
  reason=n>=25?`Dựa trên Markov: sau "${f.slice(-use.k).map(x=>NAME[x]).join('-')}" đã ra ${NAME.B} ${c.B||0}, ${NAME.P} ${c.P||0}, ${NAME.T} ${c.T||0} (${n} lần).`:`Dữ liệu học còn ít (${n} lần), xác suất gần mức gốc.`;
 }else{door='B';reason='Chưa có ván nào, dùng xác suất gốc 8 bộ bài.'}
 return{door,p:est[door],t:est.T,reason,badge,det,info}}

// ===== thêm / hoàn tác ván =====
function addHand(r){
 const f=seqF(),pr=predict(f),d=[];let h=-1;
 for(let k=1;k<=3&&k<=f.length;k++){const key='m'+k+':'+f.slice(-k).join('');inc('m',key,r,1);d.push(['m',key,r])}
 const det=detect(f);
 if(det){const o=r==='T'?'T':r===det.cont?'C':'X';inc('p',det.key,o,1);d.push(['p',det.key,o])}
 const f2=r==='T'?f:[...f,r],da=detect(f2),fam=k=>k.replace(/\d+/,'');
 if(da&&(!det||fam(det.key)!==fam(da.key))){inc('o',fam(da.key),'n',1);d.push(['o',fam(da.key),'n'])}
 if(r!=='T'){S.acc.n++;if(pr.door===r){S.acc.h++;h=1}else h=0}
 S.brain.tot++;S.E.push({r,d,h});if(S.E.length>CAP)S.E.shift()}
function undo(){const e=S.E.pop();if(!e)return;for(const[b,k,o]of e.d)inc(b,k,o,-1);
 if(e.h>=0){S.acc.n--;if(e.h===1)S.acc.h--}S.brain.tot=Math.max(0,S.brain.tot-1)}

function bkNote(){try{const bk=+localStorage.getItem(KEY+'bk')||0;return S.brain.tot>=30&&(!bk||Date.now()-bk>14*864e5)?' · Nhớ sao lưu':''}catch(e){return''}}
// ===== thống kê cầu =====
function statHTML(){
 const L=[['bet4','Bệt 4'],['bet5','Bệt 5'],['bet6','Bệt 6'],['bet7','Bệt 7+'],['pp4','1-1 (4)'],['pp5','1-1 (5)'],['pp6','1-1 (6+)'],['p12','1-2 / 2-1']];
 const q=v=>Math.round(100*v)+'%';let h='';
 for(const[k,nm]of L){const c=S.brain.p[k]||{},C=c.C||0,X=c.X||0,T=c.T||0,n=C+X+T;
  h+=`<div class="rw"><b>${nm}</b>: `+(n?`tiếp tục ${q(C/n)} · bẻ ${q(X/n)} · hòa ${q(T/n)} <span style="color:var(--mu)">(${n} lần)</span>`:'<span style="color:var(--mu)">chưa có dữ liệu</span>')+'</div>'}
 const o=S.brain.o||{},tot=S.brain.tot||0,r=k=>{const n=(o[k]||{}).n||0;return`${n} lần`+(tot?` (~${(100*n/tot).toFixed(1)}/100 ván)`:'')};
 h+=`<div class="rw"><b>Tần suất xuất hiện</b> trên ${tot} ván: Bệt ${r('bet')} · 1-1 ${r('pp')} · 1-2 ${r('p')}</div>`;
 return h+'<div class="rw" style="color:var(--mu)">Nếu các ván độc lập, các số này sẽ tiến dần về xác suất gốc khi có nhiều dữ liệu.</div>'}

// ===== giao diện =====
function render(){
 const f=seqF(),p=predict(f);
 $('cnt').textContent=`Ván ${S.E.length}/${CAP}`;
 $('door').textContent=NAME[p.door].toUpperCase();$('door').style.color=`var(--${p.door})`;
 $('pct').textContent=pc(p.p);$('tie').textContent='Hòa '+pc(p.t);
 const b=$('badge');b.style.display=p.badge?'inline-block':'none';b.textContent=p.badge?'Cầu: '+p.badge:'';
 $('why').textContent='Lý do: '+p.reason;
 const pr=$('pr'),I=p.info;
 if(I){pr.style.display='flex';pr.innerHTML=`<div><small>TIẾP TỤC CẦU</small><b>${pc(I.eC)}</b></div><div><small>BẺ CẦU</small><b>${pc(I.eX)}</b></div><div><small>HÒA</small><b>${pc(I.eT)}</b></div>`;
  $('tag').textContent=I.n<30?`Ít dữ liệu (${I.n} lần): số này gần như là xác suất gốc.`:(I.n>=100&&Math.abs(I.z)>=3)?`Có dấu hiệu lệch so với gốc (${I.n} lần). Cần kiểm tra thêm.`:`Đã học ${I.n} lần: chưa thấy khác xác suất gốc.`}
 else{pr.style.display='none';$('tag').textContent=''}
 $('stat').innerHTML=statHTML();
 $('beads').innerHTML=S.E.map(e=>`<div class="d ${e.r}">${e.r}</div>`).join('');
 const a=S.acc;$('foot').textContent=`Đã học ${S.brain.tot} ván · Gợi ý đúng ${a.h}/${a.n}`+(a.n?` (${Math.round(100*a.h/a.n)}%)`:'')+bkNote()}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3500)}
document.querySelectorAll('.k').forEach(b=>b.onclick=()=>{addHand(b.dataset.r);save()});
$('undo').onclick=()=>{undo();save()};
$('rs').onclick=()=>{if(confirm('Xáo bài mới? Lịch sử ván hiện tại sẽ bị xóa (dữ liệu đã học vẫn giữ).')){S.E=[];save();toast('Đã xáo bài mới')}};
$('exp').onclick=async()=>{const j=JSON.stringify(S.brain);try{await navigator.clipboard.writeText(j);toast('Đã chép dữ liệu học')}catch(e){prompt('Chép đoạn này để sao lưu:',j)}};
$('imp').onclick=()=>{const j=prompt('Dán dữ liệu học đã sao lưu:');if(!j)return;try{const b=JSON.parse(j);if(!b.m||!b.p)throw 0;S.brain=b;save();toast('Đã khôi phục')}catch(e){toast('Dữ liệu không hợp lệ')}};
$('dl').onclick=()=>{const b=new Blob([JSON.stringify({v:1,brain:S.brain,acc:S.acc})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bcr-kho-du-lieu.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);try{localStorage.setItem(KEY+'bk',Date.now())}catch(e){}toast('Đã tải file sao lưu');render()};
$('ld').onclick=()=>$('bf').click();
$('bf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t),b=j.brain||j;if(!b.m||!b.p)throw 0;if(S.brain.tot>0&&!confirm('Thay kho dữ liệu hiện tại bằng file này?'))return;S.brain=b;if(j.acc)S.acc=j.acc;save();toast('Đã nạp kho dữ liệu')}catch(x){toast('File không hợp lệ')}})};
$('wipe').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu đã học?')){S={E:[],brain:{m:{},p:{},tot:0},acc:{h:0,n:0}};save()}};

// Tự tìm lưới hạt (đỏ/xanh/lục) trong ảnh, trả về chuỗi B/P/T theo thứ tự cột trái->phải, trên->xuống
function detectBeads(data,W,H){
 const N=W*H,code=new Uint8Array(N);
 for(let i=0,j=0;i<N;i++,j+=4){
  const r=data[j],g=data[j+1],b=data[j+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(mx<90||d<.47*mx)continue;
  let h;if(mx===r)h=60*(((g-b)/d+6)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);
  if(h<15||h>340)code[i]=1;else if(h>200&&h<250)code[i]=2;else if(h>60&&h<160)code[i]=3}
 const seen=new Uint8Array(N),stack=new Int32Array(N),minD=.016*W,maxD=.13*W,cand=[];
 for(let s=0;s<N;s++){
  if(!code[s]||seen[s])continue;
  const cd=code[s];let sp=0,area=0,x0=W,x1=0,y0=H,y1=0;stack[sp++]=s;seen[s]=1;
  while(sp){const p=stack[--sp],x=p%W,y=(p-x)/W;area++;
   if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&code[p-1]===cd&&!seen[p-1]){seen[p-1]=1;stack[sp++]=p-1}
   if(x<W-1&&code[p+1]===cd&&!seen[p+1]){seen[p+1]=1;stack[sp++]=p+1}
   if(y>0&&code[p-W]===cd&&!seen[p-W]){seen[p-W]=1;stack[sp++]=p-W}
   if(y<H-1&&code[p+W]===cd&&!seen[p+W]){seen[p+W]=1;stack[sp++]=p+W}}
  const w=x1-x0+1,h=y1-y0+1;
  if(w<minD||h<minD||w>maxD||h>maxD)continue;
  const as=w/h;if(as<.72||as>1.38)continue;
  const fill=area/(w*h);if(fill<.45||fill>.92)continue;
  cand.push({cx:(x0+x1)/2,cy:(y0+y1)/2,s:(w+h)/2,c:cd})}
 if(cand.length<2)return{seq:[],n:0};
 cand.sort((a,b)=>a.s-b.s);
 let bi=0,bn=0;
 for(let i=0,j=0;i<cand.length;i++){if(j<i)j=i;while(j<cand.length&&cand[j].s<=cand[i].s*1.3)j++;if(j-i>=bn){bn=j-i;bi=i}}
 const grp=cand.slice(bi,bi+bn),ms=grp.map(g=>g.s).sort((a,b)=>a-b)[grp.length>>1];
 // giữ cụm liên thông lớn nhất (các hạt kề nhau)
 const par=grp.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
 for(let i=0;i<grp.length;i++)for(let j=i+1;j<grp.length;j++)
  if(Math.hypot(grp[i].cx-grp[j].cx,grp[i].cy-grp[j].cy)<=1.6*ms)par[find(i)]=find(j);
 const cnt={};grp.forEach((_,i)=>{const r=find(i);cnt[r]=(cnt[r]||0)+1});
 const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
 const beads=grp.filter((_,i)=>find(i)==best).sort((a,b)=>a.cx-b.cx);
 if(beads.length<2)return{seq:[],n:0};
 const cols=[];
 for(const b of beads){const c=cols[cols.length-1];if(c&&Math.abs(b.cx-c.m)<=.6*ms){c.l.push(b);c.m=c.l.reduce((a,x)=>a+x.cx,0)/c.l.length}else cols.push({m:b.cx,l:[b]})}
 const sym={1:'B',2:'P',3:'T'},seq=[];
 for(const c of cols){c.l.sort((a,b)=>a.cy-b.cy);for(const b of c.l)seq.push(sym[b.c])}
 return{seq,n:beads.length}}

function mergeSeq(seq){
 const H=S.E.map(e=>e.r);let m=Math.min(seq.length,H.length);
 for(;m>0;m--){if(H.slice(-m).join('')===seq.slice(0,m).join(''))break}
 if(m===0&&H.length&&seq.length){
  if(confirm('Ảnh không khớp lịch sử đang có. OK: thay lịch sử bằng ảnh (giữ dữ liệu học). Hủy: nối thêm vào cuối.'))S.E=[]}
 const add=seq.slice(m);add.forEach(addHand);save();return add.length}
$('up').onclick=()=>$('file').click();
$('file').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const im=new Image();
 im.onload=()=>{
  try{
   const sc=Math.min(1,720/im.naturalWidth),W=Math.round(im.naturalWidth*sc),H=Math.round(im.naturalHeight*sc);
   const cv=document.createElement('canvas');cv.width=W;cv.height=H;
   const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,W,H);
   const res=detectBeads(ctx.getImageData(0,0,W,H).data,W,H);
   if(res.seq.length<2){toast('Không tìm thấy bảng cầu trong ảnh');return}
   const a=mergeSeq(res.seq);
   toast(a?`Đã đọc thêm ${a} ván mới`:'Ảnh đã quét, không có ván mới')
  }catch(err){toast('Không đọc được ảnh')}
  URL.revokeObjectURL(im.src)};
 im.onerror=()=>toast('Không mở được ảnh');
