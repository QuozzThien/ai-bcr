<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BCR – Gợi ý AI</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--B:#c62828;--P:#1565c0;--T:#558b2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a3140;--B:#e53935;--P:#1e88e5;--T:#7cb342}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a3140;--B:#e53935;--P:#1e88e5;--T:#7cb342}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px;max-width:520px;margin-inline:auto}
.hero{border-radius:16px;padding:16px;color:#fff;text-align:center;background:var(--mu);transition:background .2s}
.hero .l{font-size:14px;opacity:.9}.hero .big{font-size:56px;font-weight:800;line-height:1.05;letter-spacing:1px}.hero .p{font-size:26px;font-weight:700}
.hero .s{font-size:14px;margin-top:8px;opacity:.95}
.mini{display:flex;justify-content:space-between;margin:8px 2px;font-size:14px;color:var(--mu)}
.mini b{color:var(--tx)}
.row{display:flex;gap:8px}
.k{flex:1;border:0;border-radius:14px;color:#fff;font-size:26px;font-weight:800;padding:20px 0}
.kB{background:var(--B)}.kP{background:var(--P)}.kT{background:var(--T)}
.sec{display:flex;gap:8px;margin-top:8px}
.sec button,.sec label{flex:1;text-align:center;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 4px;font-size:14px;cursor:pointer}
.sec button:active{opacity:0.7}
.strip{display:flex;gap:3px;margin:10px 0;overflow:hidden;justify-content:flex-end}
.d{flex:0 0 22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.d.B{background:var(--B)}.d.P{background:var(--P)}.d.T{background:var(--T)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}summary{color:var(--mu);font-size:14px;font-weight:bold;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}th,td{text-align:right;padding:4px}th:first-child,td:first-child{text-align:left}
.mu{color:var(--mu);font-size:13px}input{width:60px;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type="password"]{width:100%;margin-top:5px;}
canvas{display:none}
.btn-ai{background:#8e44ad;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer;display:none;}
</style></head><body>

<div class="hero" id="hero">
 <div class="l">Ván tiếp theo</div>
 <div class="big" id="pk">–</div><div class="p" id="pp"></div>
 <div class="s" id="sub"></div>
</div>
<div class="mini"><span>Con <b id="eP">–</b></span><span>Hòa <b id="eT">–</b></span><span>Cái <b id="eB">–</b></span></div>

<div class="row"><button class="k kB" onclick="add('B')">CÁI</button><button class="k kT" onclick="add('T')">HÒA</button><button class="k kP" onclick="add('P')">CON</button></div>
<div class="sec">
    <label>Quét ảnh<input id="f" type="file" accept="image/*" hidden></label>
    <button id="sc">Quét Live</button>
    <button onclick="undo()">Hoàn tác</button>
</div>

<button id="btnAI" class="btn-ai">🤖 Phân tích bằng AI (Gemini)</button>

<div class="strip" id="strip"></div>
<div class="mu" style="text-align:center">Kết quả chỉ mang tính tham khảo.</div>

<details>
<summary>Cài đặt AI & Chi tiết thuật toán</summary>
 <div style="margin-top:10px; padding:10px; background:var(--bg); border-radius:8px;">
    <div class="mu">Nhập Google Gemini API Key (Lấy miễn phí tại aistudio.google.com):</div>
    <input type="password" id="apiKey" placeholder="Dán API Key vào đây...">
 </div>
 <div class="mu" id="ctx" style="margin-top:10px"></div>
 <table><thead><tr><th></th><th>Gốc</th><th>Đã ra</th><th>Ước lượng</th><th>KTC 95%</th></tr></thead><tbody id="tb"></tbody></table>
 <div class="mu" id="bt" style="margin-top:6px"></div>
 <div class="mu" style="margin-top:6px">Vùng quét ảnh (Tỉ lệ 0-1): x0 <input id="x0" value="0"> y0 <input id="y0" value="0.694"> x1 <input id="x1" value="0.266"> y1 <input id="y1" value="0.815"></div>
 <div class="mu" id="st" style="margin-top:6px"></div>
 <button onclick="clr()" style="margin-top:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;width:100%;">Xóa toàn bộ lịch sử</button>
</details>
<canvas id="cv"></canvas>

<script>
const BASE={B:.4586,P:.4462,T:.0952},NAME={B:'Cái',P:'Con',T:'Hòa'},CAP=60;
const $=id=>document.getElementById(id),pc=v=>(100*v).toFixed(1)+'%';

let H=[];try{H=JSON.parse(localStorage.getItem('bcrH')||'[]')}catch(e){}
let apiKey = localStorage.getItem('bcrApiKey') || '';
$('apiKey').value = apiKey;
if(apiKey) $('btnAI').style.display = 'block';

function save(){try{localStorage.setItem('bcrH',JSON.stringify(H))}catch(e){}; render()}
function add(x){
    // Tránh thêm trùng lặp liên tiếp khi quét ảnh
    if(H.length>0 && H[H.length-1]===x && x!=='T') return;
    H.push(x);
    if(H.length>CAP) H.shift();
    save();
}
function undo(){if(H.length>0){H.pop();save();}}
function clr(){if(confirm('Xóa toàn bộ lịch sử?')){H=[];save();}}

function wilson(c,n){if(!n)return[0,1];const z=1.96,p=c/n,d=1+z*z/n,m=p+z*z/(2*n),s=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));return[(m-s)/d,(m+s)/d]}

// THUẬT TOÁN PHÂN TÍCH NÂNG CẤP
function getPrediction(){
    let res = { door: 'B', p: BASE.B, t: BASE.T, reason: 'Chưa có dữ liệu, dùng xác suất gốc.' };
    if(H.length === 0) return res;

    let seq = H.filter(r=>r!=='T');
    if(seq.length === 0) return res;

    let last = seq[seq.length-1];
    let streak = 1;
    for(let i=seq.length-2; i>=0; i--){ if(seq[i]===last) streak++; else break; }

    // 1. Ưu tiên Cầu Bệt
    if(streak >= 4){
        let target = last === 'B' ? 'P' : 'B';
        res.door = target;
        res.p = 0.55; 
        res.reason = `Phát hiện Cầu Bệt ${streak} tay. Khuyên BẺ CẦU sang ${NAME[target]}.`;
        return res;
    }

    // 2. Ưu tiên Cầu 1-1
    if(seq.length >= 4){
        if(seq[seq.length-1] !== seq[seq.length-2] && seq[seq.length-2] !== seq[seq.length-3]){
            let target = last === 'B' ? 'P' : 'B';
            res.door = target;
            res.p = 0.52;
            res.reason = `Phát hiện Cầu 1-1 (Ping-Pong). Bám nhịp đánh ${NAME[target]}.`;
            return res;
        }
    }

    // 3. Markov bậc 2 (Chỉ tính trong 15 ván gần nhất)
    let recent = H.slice(-15);
    let ctxCnt = {B:0, P:0};
    if(recent.length >= 2){
        let key = recent.slice(-2).join('');
        for(let i=2; i<recent.length; i++){
            if(recent.slice(i-2, i).join('') === key){
                if(recent[i] === 'B') ctxCnt.B++;
                if(recent[i] === 'P') ctxCnt.P++;
            }
        }
    }
    
    let n = ctxCnt.B + ctxCnt.P;
    if(n >= 3){
        if(ctxCnt.B > ctxCnt.P){
            res.door = 'B'; res.p = (ctxCnt.B/n)*0.9; 
            res.reason = `Markov: Sau mẫu 2 ván, Cái xuất hiện ${ctxCnt.B} lần, Con ${ctxCnt.P} lần.`;
        } else if (ctxCnt.P > ctxCnt.B) {
            res.door = 'P'; res.p = (ctxCnt.P/n)*0.9;
            res.reason = `Markov: Sau mẫu 2 ván, Con xuất hiện ${ctxCnt.P} lần, Cái ${ctxCnt.B} lần.`;
        } else {
            res.door = last; res.p = 0.5;
            res.reason = `Markov cân bằng. Đánh nối tiếp ${NAME[last]}.`;
        }
    } else {
        // Mặc định theo xu hướng 10 ván
        let b = recent.filter(x=>x==='B').length;
        let p = recent.filter(x=>x==='P').length;
        if(b>p){ res.door='B'; res.p=0.5; res.reason='Xu hướng 10 ván nghiêng về CÁI.'; }
        else if(p>b){ res.door='P'; res.p=0.5; res.reason='Xu hướng 10 ván nghiêng về CON.'; }
        else { res.door=last; res.p=0.5; res.reason='Cân bằng, đánh nối tiếp.'; }
    }

    if(res.p > 0.65) res.p = 0.65;
    if(res.p < 0.45) res.p = 0.45;
    return res;
}

function render(){
    let pred = getPrediction();
    
    $('hero').style.background = `var(--${pred.door})`;
    $('pk').textContent = NAME[pred.door].toUpperCase();
    $('pp').textContent = pc(pred.p);
    $('sub').textContent = pred.reason;
    
    $('eB').textContent = pc(pred.door==='B'?pred.p:BASE.B);
    $('eP').textContent = pc(pred.door==='P'?pred.p:BASE.P);
    $('eT').textContent = pc(BASE.T);

    $('strip').innerHTML = H.slice(-15).map(x=>`<div class="d ${x}">${x}</div>`).join('');
    
    // Cập nhật bảng thống kê
    let k = Math.min(2, H.length);
    let {cnt, n} = getCtxStats(k);
    let est = estimate(cnt, n);
    
    $('ctx').textContent = `Tổng ${H.length} ván. Mẫu 2 ván gần nhất xuất hiện ${n} lần trong quá khứ.`;
    $('tb').innerHTML = [...'BPT'].map(o => {
        const [lo, hi] = wilson(cnt[o], n);
        return `<tr><td style="color:var(--${o})">${NAME[o]}</td><td>${pc(BASE[o])}</td><td>${n?cnt[o]+'/'+n:'–'}</td><td><b>${pc(est[o])}</b></td><td>${n?pc(lo)+'–'+pc(hi):'–'}</td></tr>`;
    }).join('');
}

function getCtxStats(k) {
    const cnt={B:0,P:0,T:0}; let n=0;
    if(H.length<=k) return {cnt, n};
    const key = H.slice(-k).join('');
    for(let i=k; i<H.length; i++){
        if(H.slice(i-k,i).join('') === key){ cnt[H[i]]++; n++; }
    }
    return {cnt, n};
}
function estimate(cnt,n,m=150){const e={};for(const o of'BPT')e[o]=(cnt[o]+m*BASE[o])/(n+m);return e}

// ==========================================
// TÍNH NĂNG AI (GEMINI API)
// ==========================================
$('apiKey').onchange = (e) => {
    apiKey = e.target.value.trim();
    localStorage.setItem('bcrApiKey', apiKey);
    $('btnAI').style.display = apiKey ? 'block' : 'none';
    if(apiKey) alert('Đã lưu API Key! Hãy bấm nút Quét ảnh để tải ảnh lên, sau đó bấm "Phân tích bằng AI".');
};

$('btnAI').onclick = async () => {
    if(!apiKey) return alert('Vui lòng nhập API Key trong phần Cài đặt!');
    if(!window.lastImageBlob) return alert('Vui lòng chụp và tải ảnh bảng cầu lên trước (nút Quét ảnh).');
    
    $('btnAI').textContent = "⏳ AI đang phân tích...";
    $('btnAI').disabled = true;
    
    try {
        // Chuyển ảnh sang Base64
        const reader = new FileReader();
        reader.readAsDataURL(window.lastImageBlob);
        reader.onloadend = async () => {
            const base64data = reader.result.split(',')[1];
            
            const prompt = `Đây là ảnh bảng cầu Baccarat. Hãy đọc các hạt từ trái sang phải, từ trên xuống dưới để lấy chuỗi kết quả (B=Cái, P=Con, T=Hòa). Sau đó phân tích xem cầu đang đi theo nhịp gì (Bệt, 1-1, 1-2...) và dự đoán ván tiếp theo là B hay P. Trả lời ngắn gọn theo mẫu: "Cầu: [chuỗi]. Dự đoán: [CÁI/CON]. Lý do: [1 câu]"`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64data } }
                        ]
                    }]
                })
            });
            
            const data = await response.json();
            
            if(data.error) {
                alert("Lỗi từ AI: " + data.error.message);
            } else if(data.candidates && data.candidates[0].content.parts[0].text) {
                let aiText = data.candidates[0].content.parts[0].text;
                $('sub').innerHTML = `<span style="color:#f1c40f; font-weight:bold;">🤖 AI Phân tích:</span><br>${aiText.replace(/\n/g, '<br>')}`;
            } else {
                alert("AI không trả về kết quả.");
            }
            
            $('btnAI').textContent = "🤖 Phân tích bằng AI (Gemini)";
            $('btnAI').disabled = false;
        };
    } catch(e) {
        alert("Lỗi gọi AI: " + e.message);
        $('btnAI').textContent = "🤖 Phân tích bằng AI (Gemini)";
        $('btnAI').disabled = false;
    }
};

// ==========================================
// QUÉT ẢNH CỦA CLAUDE (GIỮ NGUYÊN)
// ==========================================
function hsv(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;if(d){if(M===r)h=((g-b)/d)%6;else if(M===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,M?d/M:0,M]}
function cls(ctx,x,y,w,h){const D=ctx.getImageData(x,y,w,h).data;let R=0,Bl=0,G=0,n=D.length/4;
 for(let i=0;i<D.length;i+=4){const[hh,s,v]=hsv(D[i],D[i+1],D[i+2]);if(s>.47&&v>.35){if(hh<15||hh>340)R++;else if(hh>200&&hh<250)Bl++;else if(hh>60&&hh<160)G++}}
 const m=Math.max(R,Bl,G);if(m/n<.04)return null;return m===R?'B':m===Bl?'P':'T'}
function readPlate(src,w,h){const cv=$('cv');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(src,0,0,w,h);
 const[x0,y0,x1,y1]=['x0','y0','x1','y1'].map(i=>parseFloat($(i).value));const X=x0*w,Y=y0*h,cw=(x1-x0)*w/6,ch=(y1-y0)*h/6,seq=[];
 for(let c=0;c<6;c++)for(let r=0;r<6;r++){const k=cls(ctx,Math.round(X+c*cw),Math.round(Y+r*ch),Math.round(cw),Math.round(ch));if(!k)return seq;seq.push(k)}return seq}
function merge(seq){let m=Math.min(seq.length,H.length);for(;m>0;m--){if(H.slice(-m).join('')===seq.slice(0,m).join(''))break}
 const add=seq.slice(m);H.push(...add);save();return add.length}

$('f').onchange=e=>{
    const f=e.target.files[0];
    if(!f)return;
    
    // Lưu ảnh lại để nút AI có thể dùng
    window.lastImageBlob = f;
    
    const im=new Image();
    im.onload=()=>{
        const s=readPlate(im,im.naturalWidth,im.naturalHeight);
        $('st').textContent=`Đọc ${s.length} hạt, thêm ${merge(s)} ván mới.`;
    };
    im.src=URL.createObjectURL(f);
    e.target.value='';
};

render();
</script></body></html>
